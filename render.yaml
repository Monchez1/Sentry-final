services:
  - type: web
    name: sentry-backend
    runtime: python
    rootDir: sentry-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false          # You will paste your Neon PostgreSQL URL here
      - key: CORS_ORIGINS
        sync: false          # Paste your Vercel frontend URL here e.g. https://sentry-final.vercel.app
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUSH_SECRET
        sync: false          # Shared secret for rotator state push endpoint
      - key: PYTHON_VERSION
        value: 3.11.0

